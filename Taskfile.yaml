version: '3'

dotenv:
  - .env

tasks:

  check:
    desc: Check required environment variables
    cmds:
      - |
        set -e

        if [ ! -f .env ]; then
          echo "ERROR: .env not found. Run: cp .env.example .env"
          exit 1
        fi
        set -a; . ./.env; set +a

        for var in \
          AKUITY_ARGOCD_INSTANCE_NAME \
          AKUITY_ORG_NAME \
          GITOPS_REPO_URL \
          GITHUB_USERNAME \
          GITHUB_PAT \
          ARGOCD_DESTINATION
        do
          if [ -z "$(printenv "$var")" ]; then
            echo "ERROR: $var is not set"
            exit 1
          fi
        done

        echo "✓ All required variables are set"
        echo "  GITOPS_REPO_URL=$GITOPS_REPO_URL"
        echo "  WORKSHOP_NAME=$WORKSHOP_NAME"

  check-tools:
    desc: Check that required CLIs are installed
    cmds:
      - |
        set -e

        for tool in akuity kargo argocd task git envsubst
        do
          if ! command -v "$tool" >/dev/null 2>&1; then
            echo "ERROR: $tool is not installed"
            exit 1
          fi
        done

        akuity version
        kargo version
        argocd version --client
        task --version
        git --version
        envsubst --version | head -1

        echo "✓ All required tools are installed"


  apply-argocd-project:
    desc: Apply shared Argo CD AppProject
    deps:
      - check
    cmds:
      - |
        set -a; . ./.env; set +a
        akuity argocd apply \
          -f argocd/app-project.yaml \
          --name "$AKUITY_ARGOCD_INSTANCE_NAME" \
          --org-name="$AKUITY_ORG_NAME"

  apply-applicationset:
    desc: Apply Argo CD ApplicationSet
    deps:
      - check
    cmds:
      - |
        set -a; . ./.env; set +a
        set -euo pipefail
        
        envsubst < argocd/applicationset.yaml | \
          akuity argocd apply \
            -f - \
            --name "$AKUITY_ARGOCD_INSTANCE_NAME" \
            --org-name="$AKUITY_ORG_NAME"
  
  apply-kargo-project:
    desc: Apply Kargo Project
    deps:
      - check
    cmds:
      - |
        set -a; . ./.env; set +a
        envsubst < kargo/project.yaml | \
          akuity kargo apply \
            -f - \
            --name "$AKUITY_KARGO_INSTANCE_NAME" \
            --org-name="$AKUITY_ORG_NAME"
  
  apply-kargo-secret:
    desc: Apply Kargo Git credentials
    deps:
      - check
    cmds:
      - |
        set -a; . ./.env; set +a
        envsubst < secret.yaml | \
          akuity kargo apply \
            -f - \
            --name "$AKUITY_KARGO_INSTANCE_NAME" \
            --org-name="$AKUITY_ORG_NAME"
  
  apply-kargo-warehouse:
    desc: Apply Kargo Warehouse
    deps:
      - check
    cmds:
      - |
        set -a; . ./.env; set +a
        envsubst < kargo/warehouse.yaml | \
          akuity kargo apply \
            -f - \
            --name "$AKUITY_KARGO_INSTANCE_NAME" \
            --org-name="$AKUITY_ORG_NAME"
  
  apply-kargo-promotion-task:
    desc: Apply Kargo PromotionTask
    deps:
      - check
    cmds:
      - |
        set -a; . ./.env; set +a
        envsubst < kargo/promotiontask.yaml | \
          akuity kargo apply \
            -f - \
            --name "$AKUITY_KARGO_INSTANCE_NAME" \
            --org-name="$AKUITY_ORG_NAME"
  
  apply-kargo-stages:
    desc: Apply Kargo Stages
    deps:
      - check
    cmds:
      - |
        set -a; . ./.env; set +a
        envsubst < kargo/stages.yaml | \
          akuity kargo apply \
            -f - \
            --name "$AKUITY_KARGO_INSTANCE_NAME" \
            --org-name="$AKUITY_ORG_NAME"
    
  apply-kargo:
    desc: Apply all Kargo resources
    cmds:
      - task: apply-kargo-project
      - task: apply-kargo-secret
      - task: apply-kargo-warehouse
      - task: apply-kargo-promotion-task
      - task: apply-kargo-stages
  
  apply-kargo-custom-step:
    desc: Apply Kargo CustomPromotionStep
    deps:
      - check
    cmds:
      - |
        set -a; . ./.env; set +a
        envsubst '${WORKSHOP_NAME}' < kargo/custom-step.yaml | \
          akuity kargo apply \
            -f - \
            --name "$AKUITY_KARGO_INSTANCE_NAME" \
            --org-name="$AKUITY_ORG_NAME"


  apply-kargo-application:
    desc: Apply Kargo Application
    deps:
      - check
    cmds:
      - |
        set -a; . ./.env; set +a
        envsubst < argocd/kargo-resources-application.yaml | \
          akuity argocd apply \
            -f - \
            --name "$AKUITY_ARGOCD_INSTANCE_NAME" \
            --org-name="$AKUITY_ORG_NAME"

  setup:
    desc: Set up workshop
    cmds:
      - task: check
      - task: apply-argocd-project
      - task: apply-applicationset
      - task: apply-kargo
  
  port-forward:
    desc: "Port-forward to a stage's nginx Service (usage: task port-forward STAGE=dev)"
    vars:
      STAGE: '{{.STAGE | default "dev"}}'
      PORT: '{{.PORT | default "8080"}}'
    cmds:
      - echo "Open http://localhost:{{.PORT}}"
      - |
        set -a; . ./.env; set +a
        kubectl port-forward svc/nginx {{.PORT}}:80 -n "$WORKSHOP_NAME-{{.STAGE}}"


  argocd-login:
    desc: Log in to your Argo CD instance
    requires:
      vars: [ARGOCD_SERVER]
    cmds:
      - |
        set -a; . ./.env; set +a
        argocd login "$ARGOCD_SERVER" --grpc-web
  
  kargo-login:
    desc: Log in to your Kargo instance
    requires:
      vars: [KARGO_SERVER]
    cmds:
      - |
        set -a; . ./.env; set +a
        kargo login $KARGO_SERVER

  cleanup-kargo:
    desc: Delete your Kargo Project and everything in it
    cmds:
      - |
        set -a; . ./.env; set +a
        kargo delete project "$WORKSHOP_NAME"

  cleanup-argocd:
    desc: Delete your ApplicationSet and its Applications
    cmds:
      - |
        set -a; . ./.env; set +a
        argocd appset delete "$WORKSHOP_NAME" --yes

  cleanup:
    desc: Clean up your workshop resources
    cmds:
      - task: cleanup-argocd
      - task: cleanup-kargo